# Declare stages
stages:
  - init
  - build
  - test
  - test_install
  - deploy

# Default variables and parameters
variables:
#  CI_BUILDS_DIR: $WORKDIR/.jacamar-ci/builds
  CUSTOM_CI_BUILDS_DIR: $WORKDIR/test # inactif car option non activee dans la configuration du runner
  GIT_STRATEGY: none # don't do anything by default
  # CI_DEBUG_TRACE: "true" #Uncomment to debug CI
default:
  tags: #All jobs uses jamacar-slurm executor
    - juno-shell
  id_tokens:
    CI_JOB_JWT:
      aud: https://gitlab.onera.net


init_repo:
  variables:
    SCHEDULER_PARAMETERS: "--qos=co_inter_bigmem --cpus-per-task=24 --ntasks=1 --time=01:00:00" # useless with juno-shell
  stage: init
  script: # explicitly load modules one by one, so that if one fails, it will be easy to identify
    - INIT_ORIGINAL_FOLDER=$(pwd)
    - WORK_FOLDER=/tmp_user/juno/$(whoami)/.jacamar-ci/${CI_PROJECT_NAME}
    - mkdir -p ${WORK_FOLDER}
    - cd ${WORK_FOLDER}
    - echo "Clone directory $PWD/${CI_PIPELINE_ID}"
    - echo "CUSTOM_CI_DIR=$PWD/${CI_PIPELINE_ID}" >> ${INIT_ORIGINAL_FOLDER}/build.env
    - git clone ${CI_REPOSITORY_URL} ${CI_PIPELINE_ID}
    - cd ${CI_PIPELINE_ID}
    - git checkout ${CI_COMMIT_SHA}
    - git submodule update --init extensions/paradigma
  artifacts:
    reports:
      dotenv: build.env


build:
  parallel:
    matrix:
        - COMPILER: "gcc@12"
          GNUM64:
            - "ON"
          MPI_LIB:
            - "intel-oneapi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "gcc@12"
          GNUM64:
            - "ON"
          MPI_LIB:
            - "intel-oneapi"
          PDMA:
            - "OFF"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "gcc@12"
          GNUM64:
            - "ON"
          MPI_LIB:
            - "intel-oneapi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Coverage"
        - COMPILER: "gcc@12"
          GNUM64:
            - "ON"
          MPI_LIB:
            - "openmpi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Debug"
        - COMPILER: "gcc@14" # socle7: openmpi, gcc@14, Cython 3
          GNUM64:
            - "ON"
          MPI_LIB:
            - "openmpi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Debug"
        - COMPILER: "gcc@15" # socle7: openmpi, gcc@15, Cython 3
          GNUM64:
            - "ON"
          MPI_LIB:
            - "openmpi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "gcc@12"
          GNUM64:
            - "OFF"
          MPI_LIB:
            - "intel-oneapi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "intel-llvm@2022"
          GNUM64:
            - "OFF"
          MPI_LIB:
            - "intel-oneapi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Release"
        - COMPILER: "intel@2022"
          GNUM64:
            - "ON"
          MPI_LIB:
            - "intel-oneapi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Debug"
  variables:
    MATRIX_KEY: _${COMPILER}_${MPI_LIB}_GNUM64_${GNUM64}_BUILD_${BUILD_TYPE}_PDMA_${PDMA}
  stage: build
  before_script:
    - module purge
    - echo "compilo = $COMPILER"
    - if   [[ "${COMPILER}" == "gcc@14" ]]; then
    -   source /tmp_user/juno/sonics/dist/socle_cfd7/source_gcc14_cython3.sh # socle 7 + gcc 14 + Cython 3
    - elif [[ "${COMPILER}" == "gcc@15" ]]; then
    -   source /tmp_user/juno/sonics/dist/socle_cfd7/source_gcc15_cython3.sh # socle 7 + gcc 15 + Cython 3
    - else
    -   source /tmp_user/juno/sonics/dist/source_juno_all.sh --compiler=$COMPILER --mpi=$MPI_LIB
    - fi
  script:
    - echo "Runner directory is $PWD; move to working directory $CUSTOM_CI_DIR"
    - cd $CUSTOM_CI_DIR
    - mkdir -p build$MATRIX_KEY && cd build$MATRIX_KEY
    - echo ${COMPILER}
    - echo ${MPI_LIB}
    - if   [[ "${COMPILER}" == "gcc@12" && "${MPI_LIB}" == "intel-oneapi" ]]; then
    -   cmake -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DPDM_ENABLE_PYTHON_BINDINGS=ON  -DPDM_ENABLE_BLASLAPACK=ON -DPDM_ENABLE_STATIC=OFF -DPDM_ENABLE_SHARED=ON -DPDM_ENABLE_Fortran=ON  -DPDM_ENABLE_EXTENSION_PDMA=${PDMA} -DPDM_ENABLE_LONG_G_NUM=${GNUM64} -DPDM_ENABLE_UNIT_TEST=ON -DPDM_ENABLE_Fortran_MPI_MODULE=OFF ../
    - elif [[ "${COMPILER}" == "gcc@12" && "${MPI_LIB}" == "openmpi" ]]; then
    -   cmake -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DPDM_ENABLE_PYTHON_BINDINGS=OFF -DPDM_ENABLE_BLASLAPACK=ON -DPDM_ENABLE_STATIC=ON  -DPDM_ENABLE_SHARED=ON -DPDM_ENABLE_Fortran=OFF -DPDM_ENABLE_EXTENSION_PDMA=${PDMA} -DPDM_ENABLE_LONG_G_NUM=${GNUM64} -DPDM_ENABLE_UNIT_TEST=ON -DPDM_ENABLE_Fortran_MPI_MODULE=OFF ../
    - elif [ "${COMPILER}" == "intel@2022" ]; then
    -   cmake -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DPDM_ENABLE_PYTHON_BINDINGS=ON  -DPDM_ENABLE_BLASLAPACK=ON -DPDM_ENABLE_STATIC=ON  -DPDM_ENABLE_SHARED=ON -DPDM_ENABLE_Fortran=ON  -DPDM_ENABLE_EXTENSION_PDMA=${PDMA} -DPDM_ENABLE_LONG_G_NUM=${GNUM64} -DPDM_ENABLE_UNIT_TEST=ON -DPDM_ENABLE_DOC=ON ../
    - elif [ "${COMPILER}" == "intel-llvm@2022" ]; then
    -   cmake -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DPDM_ENABLE_PYTHON_BINDINGS=OFF -DPDM_ENABLE_BLASLAPACK=ON -DPDM_ENABLE_STATIC=OFF -DPDM_ENABLE_SHARED=ON -DPDM_ENABLE_Fortran=ON  -DPDM_ENABLE_EXTENSION_PDMA=${PDMA} -DPDM_ENABLE_LONG_G_NUM=${GNUM64} -DPDM_ENABLE_UNIT_TEST=ON ../
    - else
    -   cmake -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DPDM_ENABLE_PYTHON_BINDINGS=ON  -DPDM_ENABLE_BLASLAPACK=ON -DPDM_ENABLE_STATIC=OFF -DPDM_ENABLE_SHARED=ON -DPDM_ENABLE_Fortran=ON  -DPDM_ENABLE_EXTENSION_PDMA=${PDMA} -DPDM_ENABLE_LONG_G_NUM=${GNUM64} -DPDM_ENABLE_UNIT_TEST=ON ../
    - fi
    - make -j


unit_test:
  parallel:
    matrix:
        - COMPILER: "gcc@12"
          GNUM64:
            - "ON"
          MPI_LIB:
            - "intel-oneapi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "gcc@12"
          GNUM64:
            - "ON"
          MPI_LIB:
            - "intel-oneapi"
          PDMA:
            - "OFF"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "gcc@12"
          GNUM64:
            - "ON"
          MPI_LIB:
            - "intel-oneapi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Coverage"
        - COMPILER: "gcc@12"
          GNUM64:
            - "ON"
          MPI_LIB:
            - "openmpi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Debug"
        - COMPILER: "gcc@14" # socle7: openmpi, gcc@14, Cython 3
          GNUM64:
            - "ON"
          MPI_LIB:
            - "openmpi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Debug"
        - COMPILER: "gcc@15" # socle7: openmpi, gcc@15, Cython 3
          GNUM64:
            - "ON"
          MPI_LIB:
            - "openmpi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "gcc@12"
          GNUM64:
            - "OFF"
          MPI_LIB:
            - "intel-oneapi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "intel-llvm@2022"
          GNUM64:
            - "OFF"
          MPI_LIB:
            - "intel-oneapi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Release"
        - COMPILER: "intel@2022"
          GNUM64:
            - "ON"
          MPI_LIB:
            - "intel-oneapi"
          PDMA:
            - "ON"
          BUILD_TYPE:
            - "Debug"
  variables:
    MATRIX_KEY: _${COMPILER}_${MPI_LIB}_GNUM64_${GNUM64}_BUILD_${BUILD_TYPE}_PDMA_${PDMA}
    SCHEDULER_PARAMETERS: "--qos=co_inter_bigmem --ntasks=40 --time=01:00:00 --exclusive" # useless with juno-shell
  stage: test
  before_script:
    - module purge
    - if   [[ "${COMPILER}" == "gcc@14" ]]; then
    -   source /tmp_user/juno/sonics/dist/socle_cfd7/source_gcc14_cython3.sh # socle 7 + gcc 14 + Cython 3
    - elif [[ "${COMPILER}" == "gcc@15" ]]; then
    -   source /tmp_user/juno/sonics/dist/socle_cfd7/source_gcc15_cython3.sh # socle 7 + gcc 15 + Cython 3
    - else
    -   source /tmp_user/juno/sonics/dist/source_juno_all.sh --compiler=$COMPILER --mpi=$MPI_LIB
    - fi
  script:
    - INIT_ORIGINAL_FOLDER=$(pwd)
    - echo "Runner directory is $PWD; move to working directory $CUSTOM_CI_DIR"
    - export SLURM_EXACT=1
    - export I_MPI_PMI_LIBRARY=/usr/lib64/libpmi.so
    - cd $CUSTOM_CI_DIR/build$MATRIX_KEY
#    - ./pdm_run -srun # KO avec openmpi
    - ./pdm_run -timeout 360
    - if [ "${BUILD_TYPE}" == "Coverage" ]; then
    -   find src -name "*.gcno" -exec gcov -b -l -p -c {} + || true
    -   find extensions/paradigma/src -name "*.gcno" -exec gcov -b -l -p -c {} + || true
    -   cd $CUSTOM_CI_DIR/build$MATRIX_KEY
    -   gcovr --gcov-ignore-parse-errors -g -k --xml-pretty --print-summary --root $CUSTOM_CI_DIR --object-directory $CUSTOM_CI_DIR/build$MATRIX_KEY --output $INIT_ORIGINAL_FOLDER/coverage.xml
    - fi
  when: on_success
  coverage: /lines:\s*(\d+\.\d+)%/
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml


