fake_install:
  stage: test_install
  variables:
    COMPILER: gcc@12
    GNUM64: "ON"
    MPI_LIB: "intel-oneapi"
    PDMA: "ON"
    BUILD_TYPE: "Release"
    MATRIX_KEY: _${COMPILER}_${MPI_LIB}_GNUM64_${GNUM64}_BUILD_${BUILD_TYPE}_PDMA_${PDMA}
  before_script:
    - module purge
    - echo "compilo = $COMPILER"
    - source /tmp_user/juno/sonics/dist/source_juno_all.sh --compiler=$COMPILER --mpi=$MPI_LIB
  script:
    - echo "Runner directory is $PWD; move to working directory $CUSTOM_CI_DIR"
    - cd $CUSTOM_CI_DIR
    - mkdir -p build_fake_install$MATRIX_KEY && cd build_fake_install$MATRIX_KEY
    - export PDM_INSTALL_ROOT=${PWD}/fake_install
    - echo ${COMPILER}
    - echo ${MPI_LIB}
    - echo ${PDM_INSTALL_ROOT}
    - cmake -DCMAKE_INSTALL_PREFIX=${PDM_INSTALL_ROOT} -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DPDM_ENABLE_Fortran_MPI_MODULE=OFF -DPDM_ENABLE_PYTHON_BINDINGS=ON -DPDM_ENABLE_BLASLAPACK=ON -DPDM_ENABLE_STATIC=ON -DPDM_ENABLE_SHARED=ON -DPDM_ENABLE_Fortran=ON -DPDM_ENABLE_EXTENSION_PDMA=${PDMA} -DPDM_ENABLE_LONG_G_NUM=${GNUM64} -DPDM_ENABLE_UNIT_TEST=ON ../
    - make -j install
    - cd $CUSTOM_CI_DIR
    - mkdir -p test_fake_install$MATRIX_KEY && cd test_fake_install$MATRIX_KEY
    - export PDM_ROOT=${PDM_INSTALL_ROOT}
    - cmake ../cmake/fake_install/


pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  before_script:
    - ''
  script:
    - mkdir -p public
    - cp -r $CUSTOM_CI_DIR/build_intel@2022_intel-oneapi_GNUM64_ON_BUILD_Debug_PDMA_ON/doc/sphinx/html public/dev
  artifacts:
    paths:
      - public
